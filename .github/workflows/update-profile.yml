name: Update public repository visual

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: write

concurrency:
  group: profile-visual
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'lokmane101/lokmane101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public repository data and diagrams
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/update-repositories.mjs
      - name: Save changed assets
        run: |
          git add assets/repositories*.svg assets/repositories.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public repository visual'
          git push
